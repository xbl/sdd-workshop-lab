<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>培训活动报名练习</title>
  <style>
    :root { color-scheme: light; background: #f6f4ee; color: #172b2d; font: 17px/1.6 "Atkinson Hyperlegible Next", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    main { max-width: 920px; margin: 0 auto; padding: clamp(32px, 7vw, 96px) 24px 56px; }
    h1 { margin: 0; line-height: 1.1; font-size: clamp(32px, 5vw, 58px); }
    p { color: #445853; }
    fieldset { margin: 30px 0; padding: 0 0 18px; border: 0; border-bottom: 2px solid #172b2d; }
    legend { margin-bottom: 8px; font-weight: 700; }
    label, button, input { display: inline-block; margin: 4px 8px 4px 0; }
    section.registration-panel { padding: 17px 0; border-bottom: 1px solid #b9c6bf; }
    h2 { margin: 0; font-size: 20px; }
    button, input { font: inherit; padding: 7px 12px; }
    input#capacity-input { width: 5.5em; }
    input#user-input { width: 14em; }
    button { background: #165950; color: white; border: 1px solid #165950; cursor: pointer; }
    button:hover { background: #10443d; }
    button:focus-visible, input:focus-visible { outline: 3px solid #ad5d28; outline-offset: 3px; }
    output { display: inline; color: #165950; font-weight: 700; }
  </style>
  <script src="registration.js" defer></script>
  <script src="page.js" defer></script>
</head>
<body>
  <main>
    <h1>培训活动报名练习</h1>
    <p>输入学员姓名即可提交报名；如需测试多用户打开多个窗口争抢名额，需接入共享存储或后端服务。</p>
    <fieldset>
      <legend>调试配置</legend>
      <label for="capacity-input">报名名额</label>
      <input id="capacity-input" type="text" inputmode="numeric" value="1">
      <button id="set-capacity" type="button">设置名额</button>
      <button id="close-registration" type="button">截止报名</button>
      <button id="reopen-registration" type="button">重新开启报名</button>
      <button id="clear-registrations" type="button">清空报名</button>
      <p><output id="config-feedback"></output></p>
    </fieldset>
    <section class="registration-panel" aria-labelledby="registration-heading">
      <h2 id="registration-heading">活动报名</h2>
      <p>当前剩余名额：<strong id="remaining">1</strong></p>
      <label for="user-input">学员姓名</label>
      <input id="user-input" type="text" placeholder="请输入学员姓名，如：甲">
      <button id="submit-registration" type="button">提交报名</button>
      <p><output id="receipt"></output></p>
    </section>
  </main>
</body>
</html>
